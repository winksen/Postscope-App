services:
  postscope:
    image: postscope:${POSTSCOPE_VERSION:-0.1.43}
    build:
      context: .
      args:
        APP_VERSION: ${POSTSCOPE_VERSION:-0.1.43}
    container_name: postscope
    restart: unless-stopped
    ports:
      - "${POSTSCOPE_HOST:-127.0.0.1}:${POSTSCOPE_PORT:-3010}:3010"
    environment:
      APP_VERSION: ${POSTSCOPE_VERSION:-0.1.43}
      LOGGING_MODE: ${LOGGING_MODE:-hybrid}
      PUBLIC_LANDING_PAGE: ${PUBLIC_LANDING_PAGE:-false}
      PORT: 3010
      # Optional hardening (see docs/SECURITY.md). Leave empty to disable.
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
      LIBRARY_ALLOW_DELETE: ${LIBRARY_ALLOW_DELETE:-true}
      LIBRARY_REDACT_SECRETS: ${LIBRARY_REDACT_SECRETS:-false}
      # Encryption at rest: set LIBRARY_ENCRYPTION_KEY, or mount a secret and set LIBRARY_ENCRYPTION_KEY_FILE.
      LIBRARY_ENCRYPTION_KEY: ${LIBRARY_ENCRYPTION_KEY:-}
      LIBRARY_ENCRYPTION_KEY_FILE: ${LIBRARY_ENCRYPTION_KEY_FILE:-}
      LIBRARY_ENCRYPTION_KEY_PREVIOUS: ${LIBRARY_ENCRYPTION_KEY_PREVIOUS:-}
      LIBRARY_AUDIT_LOG: ${LIBRARY_AUDIT_LOG:-true}
      TRUSTED_USER_HEADER: ${TRUSTED_USER_HEADER:-}
      LIBRARY_MAX_ITEMS: ${LIBRARY_MAX_ITEMS:-0}
      LIBRARY_RETENTION_DAYS: ${LIBRARY_RETENTION_DAYS:-0}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      HEALTH_EXPOSE_VERSION: ${HEALTH_EXPOSE_VERSION:-true}
      SCORE_WEIGHTS: ${SCORE_WEIGHTS:-}
    volumes:
      - postscope-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postscope-data:
