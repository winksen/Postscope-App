name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Scan sample collections with the CLI
        run: npm run scan -- public/samples/default.postman_collection.json --fail-on none --format markdown
      - name: Dependency audit (runtime)
        run: npm run audit:deps
        continue-on-error: true
